<div class="container">
  <header>

<script>
/* =========================================================
   ГЕНЕРАТОР ЧИСЕЛ
   ========================================================= */
function ri(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}
function riNZ(min, max) {
  let v = 0;
  while (v === 0) v = ri(min, max);
  return v;
}
function gcd(a, b) { return b ? gcd(b, a % b) : Math.abs(a); }
function sqrtSimplify(n) {
  let out = 1, inner = n;
  for (let i = 2; i * i <= inner; i++) {
    while (inner % (i * i) === 0) { out *= i; inner /= i * i; }
  }
  if (inner === 1) return String(out);
  if (out === 1) return `\\sqrt{${inner}}`;
  return `${out}\\sqrt{${inner}}`;
}

/* =========================================================
   ГЕНЕРАТОРЫ ЗАДАЧ
   ========================================================= */
function genLine() {
  const x1 = riNZ(-5, 5), y1 = riNZ(-5, 5), z1 = riNZ(-5, 5);
  let x2, y2, z2;
  do {
    x2 = riNZ(-5, 5); y2 = riNZ(-5, 5); z2 = riNZ(-5, 5);
  } while (x2 === x1 && y2 === y1 && z2 === z1);
  const dx = x2 - x1, dy = y2 - y1, dz = z2 - z1;
  const fmtX = x1 >= 0 ? `x - ${x1}` : `x + ${-x1}`;
  const fmtY = y1 >= 0 ? `y - ${y1}` : `y + ${-y1}`;
  const fmtZ = z1 >= 0 ? `z - ${z1}` : `z + ${-z1}`;
  return {
    title: " Уравнение прямой",
    body: `Составьте каноническое уравнение прямой, проходящей через точки $M_1(${x1};${y1};${z1})$ и $M_2(${x2};${y2};${z2})$.`,
    solution: `
      <div class="step">Найдём направляющий вектор прямой как разность координат двух точек:</div>
      <div class="step">$\\overrightarrow{M_1M_2} = \\{${x2} - (${x1});\\ ${y2} - (${y1});\\ ${z2} - (${z1})\\} = \\{${dx};${dy};${dz}\\}$.</div>
      <div class="step">Подставляем координаты в каноническое уравнение прямой:</div>
      <div class="step">$$\\frac{${fmtX}}{${dx}} = \\frac{${fmtY}}{${dy}} = \\frac{${fmtZ}}{${dz}}$$</div>
      <div class="answer">Ответ: $\\dfrac{${fmtX}}{${dx}} = \\dfrac{${fmtY}}{${dy}} = \\dfrac{${fmtZ}}{${dz}}$, направляющий вектор $\\vec{m}\\{${dx};${dy};${dz}\\}$.</div>
    `
  };
}

function genDistPointLine() {
  const x0 = riNZ(-4, 4), y0 = riNZ(-4, 4), z0 = riNZ(-4, 4);
  const x1 = riNZ(-4, 4), y1 = riNZ(-4, 4), z1 = riNZ(-4, 4);
  let m, n, p;
  do { m = riNZ(-4, 4); n = riNZ(-4, 4); p = riNZ(-4, 4); }
  while (m === 0 && n === 0 && p === 0);
  const ax = x0 - x1, ay = y0 - y1, az = z0 - z1;
  const cx = ay * p - az * n;
  const cy = az * m - ax * p;
  const cz = ax * n - ay * m;
  const cLen2 = cx*cx + cy*cy + cz*cz;
  const sLen2 = m*m + n*n + p*p;
  const fmtX = x1 >= 0 ? `x - ${x1}` : `x + ${-x1}`;
  const fmtY = y1 >= 0 ? `y - ${y1}` : `y + ${-y1}`;
  const fmtZ = z1 >= 0 ? `z - ${z1}` : `z + ${-z1}`;
  return {
    title: " Расстояние от точки до прямой",
    body: `Найдите расстояние от точки $M(${x0};${y0};${z0})$ до прямой $\\dfrac{${fmtX}}{${m}} = \\dfrac{${fmtY}}{${n}} = \\dfrac{${fmtZ}}{${p}}$.`,
    solution: `
      <div class="step">Из уравнения прямой выписываем направляющий вектор $\\vec{s}\\{${m};${n};${p}\\}$ и точку на прямой $M_0(${x1};${y1};${z1})$.</div>
      <div class="step">Вектор от $M_0$ к $M$: $\\overrightarrow{M_0M} = \\{${x0} - (${x1});\\ ${y0} - (${y1});\\ ${z0} - (${z1})\\} = \\{${ax};${ay};${az}\\}$.</div>
      <div class="step">Вычисляем векторное произведение $\\vec{c} = \\overrightarrow{M_0M} \\times \\vec{s}$ через определитель:</div>
      <div class="step">$$\\vec{c} = \\begin{vmatrix} i & j & k \\\\ ${ax} & ${ay} & ${az} \\\\ ${m} & ${n} & ${p} \\end{vmatrix} = \\{${cx};${cy};${cz}\\}$$</div>
      <div class="step">Находим длины: $|\\vec{c}| = \\sqrt{${cx*cx} + ${cy*cy} + ${cz*cz}} = ${sqrtSimplify(cLen2)}$, &nbsp; $|\\vec{s}| = \\sqrt{${m*m} + ${n*n} + ${p*p}} = ${sqrtSimplify(sLen2)}$.</div>
      <div class="step">Подставляем в формулу $d = \\dfrac{|\\vec{c}|}{|\\vec{s}|}$:</div>
      <div class="step">$$d = \\frac{${sqrtSimplify(cLen2)}}{${sqrtSimplify(sLen2)}}$$</div>
      <div class="answer">Ответ: $d = \\dfrac{${sqrtSimplify(cLen2)}}{${sqrtSimplify(sLen2)}}$.</div>
    `
  };
}

function genPlane() {
  const x1 = riNZ(-4, 4), y1 = riNZ(-4, 4), z1 = riNZ(-4, 4);
  let x2, y2, z2, x3, y3, z3, A, B, C;
  do {
    x2 = riNZ(-4, 4); y2 = riNZ(-4, 4); z2 = riNZ(-4, 4);
    x3 = riNZ(-4, 4); y3 = riNZ(-4, 4); z3 = riNZ(-4, 4);
    const a1 = x2 - x1, b1 = y2 - y1, c1 = z2 - z1;
    const a2 = x3 - x1, b2 = y3 - y1, c2 = z3 - z1;
    A = b1 * c2 - c1 * b2;
    B = c1 * a2 - a1 * c2;
    C = a1 * b2 - b1 * a2;
  } while (A === 0 && B === 0 && C === 0);
  const a1 = x2 - x1, b1 = y2 - y1, c1 = z2 - z1;
  const a2 = x3 - x1, b2 = y3 - y1, c2 = z3 - z1;
  const D = -(A * x1 + B * y1 + C * z1);
  const t = (coef, v) => coef === 0 ? "" : ` ${coef > 0 ? "+" : "−"} ${Math.abs(coef) === 1 ? "" : Math.abs(coef)}${v}`;
  const eq = `${A}x${t(B,"y")}${t(C,"z")}${D >= 0 ? " + " + D : " − " + Math.abs(D)} = 0`;
  return {
    title: " Уравнение плоскости",
    body: `Составьте уравнение плоскости, проходящей через точки $A(${x1};${y1};${z1})$, $B(${x2};${y2};${z2})$, $C(${x3};${y3};${z3})$.`,
    solution: `
      <div class="step">Составим определитель третьего порядка, где первая строка — разности координат текущей точки $(x;y;z)$ и точки $A$, а вторая и третья — векторы $\\overrightarrow{AB}$ и $\\overrightarrow{AC}$:</div>
      <div class="step">$$\\begin{vmatrix} x - (${x1}) & y - (${y1}) & z - (${z1}) \\\\ ${a1} & ${b1} & ${c1} \\\\ ${a2} & ${b2} & ${c2} \\end{vmatrix} = 0$$</div>
      <div class="step">Раскрываем определитель по правилу треугольников и приводим подобные:</div>
      <div class="step">$$${eq}$$</div>
      <div class="answer">Ответ: $${eq}$, $\\vec{n}\\{${A};${B};${C}\\}$.</div>
    `
  };
}

function genDistPointPlane() {
  let A, B, C, D;
  do { A = riNZ(-5, 5); B = riNZ(-5, 5); C = riNZ(-5, 5); D = riNZ(-8, 8); }
  while (A === 0 && B === 0 && C === 0);
  const x0 = riNZ(-4, 4), y0 = riNZ(-4, 4), z0 = riNZ(-4, 4);
  const num = Math.abs(A * x0 + B * y0 + C * z0 + D);
  const den2 = A*A + B*B + C*C;
  const t = (coef, v) => coef === 0 ? "" : ` ${coef > 0 ? "+" : "−"} ${Math.abs(coef) === 1 ? "" : Math.abs(coef)}${v}`;
  const eq = `${A}x${t(B,"y")}${t(C,"z")}${D >= 0 ? " + " + D : " − " + Math.abs(D)} = 0`;
  return {
    title: " Расстояние от точки до плоскости",
    body: `Найдите расстояние от точки $M(${x0};${y0};${z0})$ до плоскости $${eq}$.`,
    solution: `
      <div class="step">Из уравнения плоскости выписываем вектор нормали $\\vec{n}\\{${A};${B};${C}\\}$.</div>
      <div class="step">Подставляем координаты точки $M$ в левую часть уравнения плоскости:</div>
      <div class="step">$$${A} \\cdot ${x0} + ${B} \\cdot ${y0} + ${C} \\cdot ${z0} + (${D}) = ${A*x0 + B*y0 + C*z0 + D}$$</div>
      <div class="step">Берём модуль: $|${A*x0 + B*y0 + C*z0 + D}| = ${num}$.</div>
      <div class="step">Считаем длину вектора нормали: $|\\vec{n}| = \\sqrt{${A*A} + ${B*B} + ${C*C}} = \\sqrt{${den2}} = ${sqrtSimplify(den2)}$.</div>
      <div class="step">По формуле $\\rho = \\dfrac{|Ax_0 + By_0 + Cz_0 + D|}{|\\vec{n}|}$:</div>
      <div class="step">$$\\rho = \\frac{${num}}{${sqrtSimplify(den2)}}$$</div>
      <div class="answer">Ответ: $\\rho = \\dfrac{${num}}{${sqrtSimplify(den2)}}$.</div>
    `
  };
}

function genAngleLines() {
  let m1, n1, p1, m2, n2, p2;
  do {
    m1 = riNZ(-4, 4); n1 = riNZ(-4, 4); p1 = riNZ(-4, 4);
    m2 = riNZ(-4, 4); n2 = riNZ(-4, 4); p2 = riNZ(-4, 4);
  } while ((m1 === 0 && n1 === 0 && p1 === 0) || (m2 === 0 && n2 === 0 && p2 === 0));
  const dot = Math.abs(m1 * m2 + n1 * n2 + p1 * p2);
  const l1 = m1*m1 + n1*n1 + p1*p1;
  const l2 = m2*m2 + n2*n2 + p2*p2;
  return {
    title: " Угол между прямыми",
    body: `Найдите угол между прямыми $\\dfrac{x}{${m1}} = \\dfrac{y}{${n1}} = \\dfrac{z}{${p1}}$ и $\\dfrac{x}{${m2}} = \\dfrac{y}{${n2}} = \\dfrac{z}{${p2}}$.`,
    solution: `
      <div class="step">Направляющие векторы: $\\vec{m_1}\\{${m1};${n1};${p1}\\}$, $\\vec{m_2}\\{${m2};${n2};${p2}\\}$.</div>
      <div class="step">Скалярное произведение: $\\vec{m_1} \\cdot \\vec{m_2} = ${m1} \\cdot ${m2} + ${n1} \\cdot ${n2} + ${p1} \\cdot ${p2} = ${m1*m2 + n1*n2 + p1*p2}$.</div>
      <div class="step">Берём модуль: $|\\vec{m_1} \\cdot \\vec{m_2}| = ${dot}$.</div>
      <div class="step">Длины векторов: $|\\vec{m_1}| = ${sqrtSimplify(l1)}$, $|\\vec{m_2}| = ${sqrtSimplify(l2)}$.</div>
      <div class="step">По формуле $\\cos\\alpha = \\dfrac{|\\vec{m_1} \\cdot \\vec{m_2}|}{|\\vec{m_1}| \\cdot |\\vec{m_2}|}$:</div>
      <div class="step">$$\\cos\\alpha = \\frac{${dot}}{${sqrtSimplify(l1)} \\cdot ${sqrtSimplify(l2)}}$$</div>
      <div class="answer">Ответ: $\\alpha = \\arccos\\dfrac{${dot}}{${sqrtSimplify(l1)} \\cdot ${sqrtSimplify(l2)}}$.</div>
    `
  };
}

function genAngleLinePlane() {
  let m, n, p, A, B, C;
  do {
    m = riNZ(-4, 4); n = riNZ(-4, 4); p = riNZ(-4, 4);
    A = riNZ(-4, 4); B = riNZ(-4, 4); C = riNZ(-4, 4);
  } while ((m === 0 && n === 0 && p === 0) || (A === 0 && B === 0 && C === 0));
  const dot = Math.abs(m * A + n * B + p * C);
  const l1 = m*m + n*n + p*p;
  const l2 = A*A + B*B + C*C;
  const t = (coef, v) => coef === 0 ? "" : ` ${coef > 0 ? "+" : "−"} ${Math.abs(coef) === 1 ? "" : Math.abs(coef)}${v}`;
  const eq = `${A}x${t(B,"y")}${t(C,"z")} = 0`;
  return {
    title: " Угол между прямой и плоскостью",
    body: `Найдите угол между прямой $\\dfrac{x}{${m}} = \\dfrac{y}{${n}} = \\dfrac{z}{${p}}$ и плоскостью $${eq}$.`,
    solution: `
      <div class="step">Из уравнения прямой выписываем направляющий вектор $\\vec{c}\\{${m};${n};${p}\\}$.</div>
      <div class="step">Из уравнения плоскости выписываем вектор нормали $\\vec{n}\\{${A};${B};${C}\\}$.</div>
      <div class="step">Скалярное произведение: $\\vec{c} \\cdot \\vec{n} = ${m} \\cdot ${A} + ${n} \\cdot ${B} + ${p} \\cdot ${C} = ${m*A + n*B + p*C}$.</div>
      <div class="step">Берём модуль: $|\\vec{c} \\cdot \\vec{n}| = ${dot}$.</div>
      <div class="step">Длины: $|\\vec{c}| = ${sqrtSimplify(l1)}$, $|\\vec{n}| = ${sqrtSimplify(l2)}$.</div>
      <div class="step">По формуле $\\sin\\alpha = \\dfrac{|\\vec{c} \\cdot \\vec{n}|}{|\\vec{c}| \\cdot |\\vec{n}|}$:</div>
      <div class="step">$$\\sin\\alpha = \\frac{${dot}}{${sqrtSimplify(l1)} \\cdot ${sqrtSimplify(l2)}}$$</div>
      <div class="answer">Ответ: $\\alpha = \\arcsin\\dfrac{${dot}}{${sqrtSimplify(l1)} \\cdot ${sqrtSimplify(l2)}}$.</div>
    `
  };
}

function genAnglePlanes() {
  let A1, B1, C1, A2, B2, C2;
  do {
    A1 = riNZ(-4, 4); B1 = riNZ(-4, 4); C1 = riNZ(-4, 4);
    A2 = riNZ(-4, 4); B2 = riNZ(-4, 4); C2 = riNZ(-4, 4);
  } while ((A1 === 0 && B1 === 0 && C1 === 0) || (A2 === 0 && B2 === 0 && C2 === 0));

          <div class="step">$\\cos\\angle CBE = \\dfrac{|0+ a \\cdot a + 0|}{a \\cdot \\dfrac{a\\sqrt{5}}{2}} = \\dfrac{2}{\\sqrt{5}}$.</div>
          <div class="step">Косинусы равны, значит углы равны. Что и требовалось доказать.</div>
          <div class="step"><b>Пункт б).</b> $\\cos\\alpha = \\dfrac{2}{\\sqrt{5}} = \\dfrac{2\\sqrt{5}}{5}$.</div>
          <div class="answer">Ответ: б) $\\alpha = \\arccos\\dfrac{2\\sqrt{5}}{5}$.</div>
        `
      },
      {
        title: " Задача 5. Правильная треугольная призма",
        body: "Основание прямой призмы $ABCA_1B_1C_1$ — равнобедренный треугольник $ABC$ ($AB = AC = 5$, $BC = 8$). Высота призмы 3.<br>а) Докажите, что треугольник $A_1BC$ остроугольный.<br>б) Найдите угол между прямой $A_1B$ и плоскостью $BCC_1$.",
        img: "prism3.png",
        solution: `
          <div class="step"><b>Пункт а).</b> Пусть $M$ — середина $BC$. Так как $AB = AC$, $AM$ — медиана и высота равнобедренного треугольника.</div>
          <div class="step">$BM = BC/2 = 4$. По теореме Пифагора: $AM = \\sqrt{AB^2 - BM^2} = \\sqrt{25 - 16} = 3$.</div>
          <div class="step">Введём систему координат: $A(0;0;0)$, ось $Ox$ вдоль $AM$, ось $Oy$ — параллельно $CB$, ось $Oz$ — вдоль $AA_1$.</div>
          <div class="step">Точки: $M(3;0;0)$, $B(3;-4;0)$, $C(3;4;0)$, $A_1(0;0;3)$.</div>
          <div class="step">Вычислим стороны треугольника $A_1BC$:</div>
          <div class="step">$A_1B^2 = (3-0)^2 + (-4-0)^2 + (0-3)^2 = 9 + 16 + 9 = 34$.</div>
          <div class="step">$A_1C^2 = (3-0)^2 + (4-0)^2 + (0-3)^2 = 9 + 16 + 9 = 34$.</div>
          <div class="step">$BC^2 = (3-3)^2 + (4-(-4))^2 + 0 = 64$.</div>
          <div class="step">Наибольшая сторона $BC = 8$. Проверим: $BC^2 = 64 < A_1B^2 + A_1C^2 = 34 + 34 = 68$.</div>
          <div class="step">Если квадрат наибольшей стороны меньше суммы квадратов двух других сторон, треугольник остроугольный. Что и требовалось доказать.</div>
          <div class="step"><b>Пункт б).</b> Направляющий вектор прямой $A_1B$: $\\overrightarrow{A_1B} = (3;-4;-3)$.</div>
          <div class="step">Плоскость $BCC_1$ проходит через точки $B(3;-4;0)$, $C(3;4;0)$, $C_1(3;4;3)$.</div>
          <div class="step">Все три точки имеют $x = 3$, значит плоскость задаётся уравнением $x - 3 = 0$, $\\vec{n}\\{1;0;0\\}$.</div>
          <div class="step">По формуле $\\sin\\alpha = \\dfrac{|\\vec{c} \\cdot \\vec{n}|}{|\\vec{c}| \\cdot |\\vec{n}|}$:</div>
          <div class="step">$\\vec{c} \\cdot \\vec{n} = 3 \\cdot 1 + (-4) \\cdot 0 + (-3) \\cdot 0 = 3$.</div>
          <div class="step">$|\\vec{c}| = \\sqrt{9 + 16 + 9} = \\sqrt{34}$, &nbsp; $|\\vec{n}| = 1$.</div>
          <div class="step">$\\sin\\alpha = \\dfrac{3}{\\sqrt{34}} = \\dfrac{3\\sqrt{34}}{34}$.</div>
          <div class="answer">Ответ: б) $\\alpha = \\arcsin\\dfrac{3\\sqrt{34}}{34}$.</div>
        `
      }
    ]
  }
];

/* =========================================================
   ЛОГИКА
   ========================================================= */
const app = document.getElementById("app");
const searchInput = document.getElementById("search");

function renderLatex(el) {
  if (window.renderMathInElement) {
    renderMathInElement(el, {
      delimiters: [
        { left: "$$", right: "$$", display: true },
        { left: "$", right: "$", display: false }
      ],
      throwOnError: false
    });
  }
}

function renderMenu() {
  searchInput.value = "";
  app.innerHTML = `
    <div class="menu">
      ${sections.map(s => {
        let label;
        if (s.generators) label = `${s.generators.length} задач`;
        else if (s.tasks && s.tasks.length > 0) label = `${s.tasks.length} задач`;
        else label = "теория";
        return `
          <button class="menu-item" onclick="openSection('${s.id}')">
            <span>${s.title}</span>
            <span class="count">${label}</span>
          </button>
        `;
      }).join("")}
    </div>
  `;
  renderLatex(app);
}

function openSection(id) {
  const s = sections.find(x => x.id === id);
  if (!s) return;

  app.innerHTML = `
    <div class="section-header">
      <button class="back-btn" onclick="renderMenu()">← К списку тем</button>
      <h2>${s.title}</h2>
    </div>
    ${s.theory ? `<div class="theory">${s.theory}</div>` : ""}
    <div id="tasks"></div>
  `;

  const box = document.getElementById("tasks");

  if (s.generators) {
    s.generators.forEach((gen, i) => {
      const task = gen();
      const card = document.createElement("div");
      card.className = "task";
      card.dataset.genIndex = i;
      card.dataset.sectionId = s.id;
      card.innerHTML = `
        <div class="task-title">
          <span>Задача ${i + 1}</span>
          <span class="regen">числа генерируются заново</span>
        </div>
        <div class="task-body">${task.body}</div>
        <div class="btn-row">
          <button class="btn-solution" onclick="toggleSolution(this)">Показать решение</button>
          <button class="btn-regen" onclick="regenTask(this)">Сгенерировать заново</button>
        </div>
        <div class="solution">${task.solution}</div>
      `;
      box.appendChild(card);
    });
  } else if (s.tasks && s.tasks.length > 0) {
    s.tasks.forEach(t => {
      const card = document.createElement("div");
      card.className = "task";
      card.innerHTML = `
        <div class="task-title">${t.title}</div>
        <div class="task-body">${t.body}</div>
        ${t.img ? `<img class="task-img" src="${t.img}" alt="Чертёж">` : ""}
        <button class="btn-solution" onclick="toggleSolution(this)">Показать решение</button>
        <div class="solution">${t.solution}</div>
      `;
      box.appendChild(card);
    });
  } else {
    box.innerHTML = `<div class="empty">В этом разделе пока нет задач.</div>`;
  }

  renderLatex(app);
}

function toggleSolution(btn) {
  const sol = btn.closest(".task").querySelector(".solution");
  if (sol.classList.contains("show")) {
    sol.classList.remove("show");
    btn.textContent = "Показать решение";
  } else {
    sol.classList.add("show");
    btn.textContent = "Скрыть решение";
  }
  renderLatex(sol);
}

function regenTask(btn) {
  const card = btn.closest(".task");
  const sectionId = card.dataset.sectionId;
  const genIndex = parseInt(card.dataset.genIndex);
  const s = sections.find(x => x.id === sectionId);
  if (!s || !s.generators) return;

  const task = s.generators[genIndex]();
  card.querySelector(".task-body").innerHTML = task.body;
  const sol = card.querySelector(".solution");
  sol.innerHTML = task.solution;
  sol.classList.remove("show");
  card.querySelector(".btn-solution").textContent = "Показать решение";
  renderLatex(card);
}

searchInput.addEventListener("input", () => {
  const q = searchInput.value.trim().toLowerCase();
  if (!q) { renderMenu(); return; }
  const found = sections.filter(s =>
    s.title.toLowerCase().includes(q) ||
    (s.theory && s.theory.toLowerCase().includes(q))
  );
  app.innerHTML = `
    <div class="section-header">
      <button class="back-btn" onclick="renderMenu()">← К списку</button>
      <h2>Поиск: «${q}»</h2>
    </div>
    <div class="menu" id="search-menu"></div>
  `;
  const menu = document.getElementById("search-menu");
  if (found.length === 0) {
    menu.innerHTML = `<div class="empty">Ничего не найдено.</div>`;
  } else {
    found.forEach(s => {
      let label;
      if (s.generators) label = `${s.generators.length} задач`;
      else if (s.tasks && s.tasks.length > 0) label = `${s.tasks.length} задач`;
      else label = "теория";
      const b = document.createElement("button");
      b.className = "menu-item";
      b.innerHTML = `<span>${s.title}</span><span class="count">${label}</span>`;
      b.onclick = () => openSection(s.id);
      menu.appendChild(b);
    });
  }
  renderLatex(app);
});

renderMenu();
</script>
</body>
</html>
